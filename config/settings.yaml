# ---- Risk envelope ($500). The non-negotiable price of full autonomy. ----
risk:
  max_risk_per_trade_pct: 1.0     # used by risk_pct sizing as fallback
  max_position_notional_pct: 15.0 # ~$75 max per position (7 positions × 15% = 105%)
  max_concurrent_positions: 7     # hold up to 7 of 20 assets at a time
  max_deployed_pct: 90.0          # stay ≤90% invested (keep a cash buffer)
  daily_loss_cap_pct: 3.0         # -3% (-$15) → halt for the day
  drawdown_alert_pct: 10.0        # warn
  drawdown_kill_pct: 15.0         # -15% (-$75) → kill + require manual re-arm
  max_trades_per_day: 20          # up to 1 entry per asset per day
  leverage_cap: 1                 # spot only; 1x. NEVER raise without review.
  sizing_mode: vol_target         # vol_target: size = (target_vol/realized_vol)*equity
  fixed_fraction_pct: 20.0        # fallback if vol_target unavailable
  target_annual_vol_pct: 40.0     # portfolio vol target (scales down in bear markets)

# ---- Strategy: RobustTrend — multi-asset Donchian breakout + SMA filter ----
# Backtested across 10 assets × 9 years. Same parameters for all assets
# (no per-asset tuning = lower overfitting risk). Holding period: 2-8 weeks.
strategy:
  name: robust_trend              # swing | robust_trend | trend_long_flat | ema_cross | mean_reversion | momentum
  timeframe: 1d                   # daily bars — 4H loses to fees+slippage (verified)
  donchian_period: 20             # entry: close > 20-bar Donchian high
  ema_fast: 9                     # used for MarketSnapshot / GLM context
  ema_slow: 21
  atr_period: 14
  stop_atr_mult: 2.5              # hard stop = entry - 2.5×ATR (wider for trend following)
  min_stop_pct: 1.0
  take_profit_atr_mult: 6.0       # wide TP = entry + 6×ATR (let trends run)
  volume_filter_mult: 1.0         # no volume filter (unreliable across all assets)

# ---- GLM brain (z.ai PAYG). Regime/sentiment gate, NOT the order-issuer. ----
glm:
  base_url: https://api.z.ai/api/paas/v4   # PAYG general endpoint (headless-OK)
  model: glm-4.6                            # routine calls ($0.6/$2.2 per Mtok)
  overlay_model: glm-5.2                    # escalated for genuinely ambiguous setups
  api_key_env: ZAI_API_KEY
  temperature: 0.2
  max_tokens: 512
  # If no key is set (paper mode), the overlay returns a neutral gate (approve, 1.0).

# ---- Execution. CowSwap primary (structural MEV protection + gasless). ----
execution:
  router: cowswap
  slippage_bps: 50               # 0.5% on entries
  stop_slippage_bps: 200         # 2% on stop-sells (guarantee exit over price)
  cowswap_api_url: https://api.cow.fi/base
  deadline_seconds: 60

# ---- Keeper (stop-loss monitor) ----
keeper:
  bar_close_cron: "7 1,5,9,13,17,21 * * *"  # ~every 4h, offset off the hour
  safety_poll_minutes: 15

# ---- Deployment (AWS via Terraform in the sibling infrastructure repo) ----
deployment:
  aws_region: ap-southeast-1

alerts:
  telegram_enabled: false
