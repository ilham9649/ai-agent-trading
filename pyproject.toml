[project]
name = "trading-agent"
version = "0.1.0"
description = "On-chain L2 (Base) swing-trading agent with an LLM overlay and hard code guardrails. Paper-mode default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "openai>=1.30",        # GLM via z.ai PAYG (OpenAI-compatible)
    "httpx>=0.27",         # CoinGecko / CoW order-book HTTP
    "pandas>=2.2",         # OHLCV / indicators
    "apscheduler>=3.10",   # bar-close + keeper schedule
    "structlog>=24.1",     # structured JSON logs
    "python-dateutil>=2.9",
    # Live (on-chain) execution — imported only in live mode:
    "web3>=7.0",
    "eth-account>=0.13",
    "scikit-learn>=1.9.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
trading-agent-paper = "trading_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
